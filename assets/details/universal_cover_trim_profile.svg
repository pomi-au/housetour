<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Universal Cover Trim sectional reference</title>
  <desc id="desc">A 45 millimetre arched cover, 29.5 millimetre base plate, and interchangeable insert shown in transition configuration.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="0.45" stop-color="#b8b4ac"/>
      <stop offset="1" stop-color="#72746e"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#595b55"/><stop offset="0.5" stop-color="#23241f"/><stop offset="1" stop-color="#595b55"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4l8 4Z" fill="#23241f"/></marker>
  </defs>
  <rect width="720" height="420" rx="32" fill="#f7f4ee"/>
  <text x="44" y="58" fill="#23241f" font-family="Bahnschrift,Arial,sans-serif" font-size="25" letter-spacing="3">UNIVERSAL COVER TRIM</text>
  <text x="44" y="87" fill="#74766f" font-family="Arial,sans-serif" font-size="15">Transition configuration · interchangeable insert system</text>
  <path d="M135 238 Q360 152 585 238 L574 256 Q360 184 146 256Z" fill="url(#metal)" stroke="#23241f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M286 319h148v13H286zM338 283h44v36h-44zM329 276h62v13h-62z" fill="url(#base)" stroke="#23241f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M346 202h28l-5 82h-18Z" fill="#23241f"/>
  <path d="M352 210h16M350 228h19M349 246h21" stroke="#b8b4ac" stroke-width="3"/>
  <path d="M135 132v38M585 132v38M135 151h450" fill="none" stroke="#23241f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="328" y="139" fill="#23241f" font-family="Arial,sans-serif" font-size="18" font-weight="700">45 mm</text>
  <path d="M286 360v22M434 360v22M286 373h148" fill="none" stroke="#23241f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="333" y="401" fill="#23241f" font-family="Arial,sans-serif" font-size="17" font-weight="700">29.5 mm</text>
  <text x="502" y="302" fill="#74766f" font-family="Arial,sans-serif" font-size="14">4 insert sizes</text>
  <text x="502" y="325" fill="#74766f" font-family="Arial,sans-serif" font-size="14">0–14 mm adjustment</text>
  <text x="44" y="379" fill="#b58d69" font-family="Bahnschrift,Arial,sans-serif" font-size="14" letter-spacing="1.5">COVER · INSERT · BASE PLATE</text>
</svg>
