  <text x="44" y="378" fill="#b58d69" font-family="Bahnschrift,Arial,sans-serif" font-size="14" letter-spacing="1.2">P5 · 3.6 LM · SOLID CARPET ≤ 7 MM, NO UNDERLAY</text>
